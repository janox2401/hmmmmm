<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis OS</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1b1f24; --muted: #5d6673; --line: #e2e5ea;
    --accent: #2f6fde; --ok: #1f8a4c; --warn: #b7791f; --err: #c53030; --chip: #eef2f8;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111418; --card: #1a1e24; --text: #e6e9ee; --muted: #9aa3ae; --line: #2a3038;
            --accent: #6aa0ff; --ok: #4cc27f; --warn: #e0a84a; --err: #ff6b6b; --chip: #232a33; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--card); }
  header h1 { font-size: 18px; margin: 0; letter-spacing: .02em; }
  header .meta { color: var(--muted); font-size: 13px; margin-left: auto; }
  button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--text);
           border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  main { max-width: 1200px; margin: 0 auto; padding: 20px 16px 40px; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  section.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; min-width: 0; }
  section.card h2 { font-size: 15px; margin: 0 0 10px; display: flex; align-items: baseline; gap: 8px; }
  section.card h2 .count { color: var(--muted); font-weight: 400; font-size: 13px; }
  ul.items { list-style: none; margin: 0; padding: 0; max-height: 420px; overflow: auto; }
  ul.items li { padding: 8px 0; border-top: 1px solid var(--line); }
  ul.items li:first-child { border-top: 0; }
  .name { font-weight: 600; word-break: break-word; }
  .desc { color: var(--muted); font-size: 13px; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .chip { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--chip); color: var(--muted); margin-left: 6px; font-weight: 400; vertical-align: 1px; }
  .chip.ok { color: var(--ok); } .chip.err { color: var(--err); }
  .empty { color: var(--muted); font-style: italic; padding: 6px 0; }
  .notice { background: var(--card); border: 1px solid var(--warn); border-left-width: 4px; border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; }
  code { font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; }
</style>
</head>
<body>
<header>
  <h1>Jarvis OS</h1>
  <span class="meta" id="meta">lädt …</span>
  <button id="refresh" title="Inventar neu einlesen (inkl. claude mcp list)">Neu einlesen</button>
</header>
<main>
  <div id="notices"></div>
  <div class="grid">
    <section class="card"><h2>Projekte <span class="count" id="c-projects"></span></h2><ul class="items" id="projects"></ul></section>
    <section class="card"><h2>Agents <span class="count" id="c-agents"></span></h2><ul class="items" id="agents"></ul></section>
    <section class="card"><h2>Skills <span class="count" id="c-skills"></span></h2><ul class="items" id="skills"></ul></section>
    <section class="card"><h2>MCP-Server <span class="count" id="c-mcp"></span></h2><ul class="items" id="mcp"></ul></section>
  </div>
</main>
<script>
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = (id) => document.getElementById(id);

function fill(id, items, render, emptyText) {
  $("c-" + id).textContent = items.length ? `(${items.length})` : "";
  $(id).innerHTML = items.length ? items.map(render).join("") : `<li class="empty">${esc(emptyText)}</li>`;
}

async function load(refresh = false) {
  $("meta").textContent = "lädt …";
  const res = await fetch("/api/inventory" + (refresh ? "?refresh=1" : ""));
  const inv = await res.json();

  const notices = [];
  if (!inv.codeRootExists) notices.push(`Projektordner <code>${esc(inv.codeRoot)}</code> existiert nicht. Pfad in <code>jarvis/config.json</code> anpassen.`);
  if (inv.mcp.error) notices.push(esc(inv.mcp.error));
  $("notices").innerHTML = notices.map((n) => `<div class="notice">${n}</div>`).join("");

  fill("projects", inv.projects, (p) =>
    `<li title="${esc(p.path)}"><div class="name">${esc(p.name)}${p.hasClaudeDir ? '<span class="chip">.claude</span>' : ""}</div><div class="desc">${esc(p.description)}</div></li>`,
    "Keine Unterordner gefunden.");
  fill("agents", inv.agents, (a) =>
    `<li title="${esc(a.path)}"><div class="name">${esc(a.name)}<span class="chip">${esc(a.scope)}</span></div><div class="desc">${esc(a.description)}</div></li>`,
    "Noch keine Agents (~/.claude/agents ist leer).");
  fill("skills", inv.skills, (s) =>
    `<li title="${esc(s.path)}"><div class="name">${esc(s.name)}<span class="chip">${esc(s.scope)}</span></div><div class="desc">${esc(s.description)}</div></li>`,
    "Noch keine Skills.");
  fill("mcp", inv.mcp.servers, (m) =>
    `<li><div class="name">${esc(m.name)}<span class="chip ${m.ok ? "ok" : "err"}">${esc(m.status)}</span></div><div class="desc">${esc(m.description || m.target)}</div></li>`,
    inv.mcp.raw || "Keine MCP-Server gefunden.");

  $("meta").textContent = `Projekte aus ${inv.codeRoot} · eingelesen ${new Date(inv.scannedAt).toLocaleTimeString("de-DE")}`;
}

$("refresh").onclick = () => load(true).catch((e) => ($("meta").textContent = "Fehler: " + e.message));
load().catch((e) => ($("meta").textContent = "Fehler: " + e.message));
</script>
</body>
</html>
